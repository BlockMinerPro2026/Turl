<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="dns-prefetch" href="//commons.wikimedia.org">
  <title>Таро — 72 карты · расклад</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020203;color:#d9d0d9;font-family:Georgia,"Times New Roman",serif}
    body{background:
      radial-gradient(circle at 50% 10%,rgba(54,35,55,.28),transparent 34%),
      linear-gradient(#030304,#010101 70%);padding:28px 18px 70px}
    .wrap{max-width:1250px;margin:auto}
    h1{text-align:center;font-weight:normal;letter-spacing:8px;font-size:34px;margin:10px 0 24px;color:#cdbbca}
    .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
    button.action{appearance:none;border:1px solid #594654;background:#0d0a0f;color:#d7c4d2;padding:12px 18px;border-radius:7px;cursor:pointer;font:inherit;transition:.2s;-webkit-tap-highlight-color:transparent}
    button.action:hover{background:#18111a;border-color:#9a7b91;box-shadow:0 0 18px rgba(150,110,145,.2)}
    #shuffleBtn{border-color:#8a6b82;background:#151018;color:#e3cda2;font-weight:bold;box-shadow:0 0 16px rgba(138,107,130,.15)}
    .status{text-align:center;min-height:24px;color:#8f8190;margin-bottom:8px}
    .count{text-align:center;color:#6d626d;font-size:13px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
    .card{position:relative;aspect-ratio:2/3;border:0;padding:0;background:none;cursor:pointer;perspective:900px;min-width:0;-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
    .card:focus{outline:none}
    .card:active{outline:none}
    .card>span{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;transition:transform .65s ease,box-shadow .25s,border-color .25s}
    .back{display:flex;align-items:center;justify-content:center;border:1px solid #4a3949;background:radial-gradient(circle at 50% 45%,#17121d 0,#09080b 62%,#030304 100%);box-shadow:0 0 14px rgba(111,76,111,.13),inset 0 0 22px rgba(0,0,0,.8)}
    .sigil{font-size:31px;color:#80634d;text-shadow:0 0 14px rgba(180,135,80,.22)}
    .num{position:absolute;bottom:9px;right:11px;color:#6e5967;font-size:11px}
    .front{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;border:1px solid #765d72;background:#0b090c;color:#d6c6d5}
    .front img{width:100%;height:100%;display:block;object-fit:cover;border-radius:8px}
    .card.selected .back{border-color:#b18d62;box-shadow:0 0 20px rgba(170,130,82,.25)}
    .card.revealed .back{transform:rotateY(-180deg)}
    .card.revealed .front{transform:rotateY(0)}
    .result{display:none;margin:30px auto 0;border-top:1px solid #302630;padding-top:25px;max-width:900px}
    .result.show{display:block}
    .result h2{text-align:center;font-weight:normal;letter-spacing:4px;color:#bda9bb}
    .reading{display:grid;gap:16px}
    .part{border-left:2px solid #614d5e;background:rgba(16,11,17,.6);padding:15px 18px;border-radius:0 7px 7px 0}
    .part h3{margin:0 0 8px;color:#b99665;font-size:16px}
    .part p{margin:0;color:#bcb2bd;line-height:1.65}
    @media(max-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}}
    @media(max-width:560px){body{padding:18px 8px}.grid{gap:5px}.sigil{font-size:21px}.num{font-size:8px;right:6px;bottom:5px}.front{padding:5px}h1{font-size:24px;letter-spacing:4px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Т А Р О</h1>

  <div class="controls">
    <button class="action" id="shuffleBtn" type="button" onclick="shuffleCards()">ПЕРЕМЕШАТЬ КАРТЫ</button>
    <button class="action" type="button" onclick="autoPick()">Случайный выбор</button>
    <button class="action" type="button" onclick="reset()">Начать заново</button>
  </div>

  <div class="status" id="status">Выберите любые три карты.</div>
  <div class="count" id="count">Выбрано: 0 / 3</div>
  <div class="grid" id="grid"></div>

  <section class="result" id="result">
    <h2>ВАШ РАСКЛАД</h2>
    <div class="reading">
      <div class="part"><h3 id="c1"></h3><p id="p1"></p></div>
      <div class="part"><h3 id="c2"></h3><p id="p2"></p></div>
      <div class="part"><h3 id="c3"></h3><p id="p3"></p></div>
    </div>
  </section>
</div>

<script>
  const deck = [

    ["XI", "Правосудие", "Последствия решений, баланс и необходимость назвать вещи своими именами.", "RWS_Tarot_11_Justice.jpg"],

    ["4К", "Четвёрка Кубков", "Скука, сомнение и шанс, который легко не заметить.", "Cups04.jpg"],

    ["7К", "Семёрка Кубков", "Много вариантов, фантазии и риск ошибиться в ожиданиях.", "Cups07.jpg"],
    ["8К", "Восьмёрка Кубков", "Уход от того, что больше не даёт прежнего смысла.", "Cups08.jpg"],
    ["9К", "Девятка Кубков", "Желание, удовлетворение и получение желаемого.", "Cups09.jpg"],
    ["10К", "Десятка Кубков", "Гармония, близость и ощущение эмоционального дома.", "Cups10.jpg"],

    ["КорК", "Король Кубков", "Зрелые чувства, спокойствие и эмоциональная выдержка.", "Cups14.jpg"],

    ["2М", "Двойка Мечей", "Нерешительность и необходимость сделать выбор.", "Swords02.jpg"],

    ["7М", "Семёрка Мечей", "Осторожность, скрытые намерения и необходимость проверить факты.", "Swords07.jpg"],
    ["8М", "Восьмёрка Мечей", "Ощущение ограничений, часть которых создаёт собственный страх.", "Swords08.jpg"],
    ["9М", "Девятка Мечей", "Тревога, бессонные мысли и преувеличение худшего сценария.", "Swords09.jpg"],
    ["10М", "Десятка Мечей", "Конец болезненного этапа и точка, после которой начинается новое.", "Swords10.jpg"],
    ["КМ", "Королева Мечей", "Чёткие границы, независимость и честный взгляд на ситуацию.", "Swords13.jpg"],
    ["КорМ", "Король Мечей", "Логика, стратегия, решение и контроль над эмоциями.", "Swords14.jpg"],
    ["ТП", "Туз Пентаклей", "Практический шанс, деньги, работа или полезное начало.", "Pentacles01.jpg"],
    ["2П", "Двойка Пентаклей", "Баланс нескольких дел и необходимость правильно распределить силы.", "Pentacles02.jpg"],
    ["3П", "Тройка Пентаклей", "Работа в команде, обучение и результат через мастерство.", "Pentacles03.jpg"],
    ["4П", "Четвёрка Пентаклей", "Стабильность, контроль ресурсов и страх что-то потерять.", "Pentacles04.jpg"],
    ["5П", "Пятёрка Пентаклей", "Временная нехватка поддержки, денег или уверенности.", "Pentacles05.jpg"],
    ["6П", "Шестёрка Пентаклей", "Помощь, обмен ресурсами и восстановление равновесия.", "Pentacles06.jpg"],
    ["7П", "Семёрка Пентаклей", "Терпение, ожидание результата и оценка вложенных усилий.", "Pentacles07.jpg"],
    ["8П", "Восьмёрка Пентаклей", "Навык, труд и постепенное улучшение положения.", "Pentacles08.jpg"],
    ["9П", "Девятка Пентаклей", "Самостоятельность, комфорт и результат собственных усилий.", "Pentacles09.jpg"],
    ["10П", "Десятка Пентаклей", "Долгосрочная стабильность, семья, имущество и наследие.", "Pentacles10.jpg"],
    ["КП", "Королева Пентаклей", "Практичность, забота и умение создавать устойчивость.", "Pentacles13.jpg"],
    ["КорП", "Король Пентаклей", "Финансовая зрелость, влияние и прочная основа.", "Pentacles14.jpg"],
    ["З", "Зеркало", "Ситуация возвращает вам то, что вы сами в неё вкладываете.", "RWS_Tarot_18_Moon.jpg"],
    ["Н", "Нить", "Скрытая связь между событиями, людьми или решениями.", "RWS_Tarot_17_Star.jpg"]
  ];

  const BASE_URL = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
  const imgCache = new Map();

  function preloadImages() {
    let index = 0;
    const CONCURRENCY = 6;

    function loadNext() {
      if (index >= deck.length) return;
      const card = deck[index++];
      if (!imgCache.has(card[3])) {
        const img = new Image();
        img.onload = () => imgCache.set(card[3], img.src);
        img.onerror = () => imgCache.set(card[3], null);
        img.src = BASE_URL + encodeURIComponent(card[3]);
      }
      if (index < deck.length) setTimeout(loadNext, 30);
    }

    for (let i = 0; i < CONCURRENCY; i++) loadNext();
  }

  let picks = [];
  let locked = false;

  function build() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    deck.forEach((card, i) => {
      const el = document.createElement('button');
      el.className = 'card';
      el.type = 'button';
      el.innerHTML = `
        <span class="back">
          <span class="sigil">✦</span>
          <span class="num">${String(i + 1).padStart(2, '0')}</span>
        </span>
        <span class="front">
          <img data-src="${BASE_URL + encodeURIComponent(card[3])}" alt="${card[1]}" decoding="async">
        </span>`;
      el.onclick = () => choose(i, el);
      grid.appendChild(el);
    });
    document.getElementById('count').textContent = `Выбрано: ${picks.length} / 3`;
  }

  function choose(i, el) {
    if (locked || picks.includes(i)) return;
    picks.push(i);
    el.classList.add('selected');
    document.getElementById('count').textContent = `Выбрано: ${picks.length} / 3`;
    if (picks.length === 3) {
      locked = true;
      document.getElementById('status').textContent = 'Три карты выбраны. Открываем расклад…';
      setTimeout(reveal, 400);
    }
  }

  function reveal() {
    picks.forEach((idx, n) => {
      setTimeout(() => {
        const card = document.querySelectorAll('.card')[idx];
        if (card) {
          const img = card.querySelector('img');
          if (img) {
            const filename = deck[idx][3];
            const cached = imgCache.get(filename);
            img.src = cached || img.dataset.src;
          }
          card.classList.add('revealed');
        }
      }, n * 350);
    });
    setTimeout(showResult, 3 * 350 + 400);
  }

  function showResult() {
    const [a, b, c] = picks.map(i => deck[i]);
    document.getElementById('c1').textContent = a[1];
    document.getElementById('c2').textContent = b[1];
    document.getElementById('c3').textContent = c[1];

    document.getElementById('p1').textContent =
      `Карта «${a[1]}» задаёт тон всему раскладу. ${a[2]} Это то, с чем вы уже столкнулись или что вскоре станет главной темой. Она показывает исходную точку, из которой развивается ситуация.`;

    document.getElementById('p2').textContent =
      `«${b[1]}» раскрывает скрытую сторону вопроса. ${b[2]} Это может быть внутреннее сопротивление, неожиданный поворот или ресурс, который вы пока не используете. Именно здесь находится точка роста или главное препятствие.`;

    document.getElementById('p3').textContent =
      `«${c[1]}» указывает, куда движется ситуация. ${c[2]} Это не окончательный приговор, а вектор: если события пойдут своим чередом, они приведут именно к этой энергии. Однако многое зависит от вашей реакции на первые две карты.`;

    document.getElementById('result').classList.add('show');
    document.getElementById('status').textContent = 'Расклад открыт.';
  }

  function shuffleCards() {
    if (locked) return;
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    picks = [];
    document.getElementById('result').classList.remove('show');
    document.getElementById('status').textContent = 'Карты перемешаны. Выберите три.';
    build();
  }

  function autoPick() {
    if (locked) return;
    picks = [];
    build();
    const order = [...Array(deck.length).keys()].sort(() => Math.random() - 0.5).slice(0, 3);
    order.forEach((idx, n) => {
      setTimeout(() => {
        const card = document.querySelectorAll('.card')[idx];
        choose(idx, card);
      }, n * 250);
    });
  }

  function reset() {
    picks = [];
    locked = false;
    document.getElementById('result').classList.remove('show');
    document.getElementById('status').textContent = 'Выберите любые три карты.';
    build();
  }

  build();
  preloadImages();
</script>
</body>
</html>
