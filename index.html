<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Насколько ты знаешь Данила?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            max-width: 650px;
            width: 100%;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 15px;
            border-left: 5px solid #302b63;
        }
        .question-text {
            font-weight: 700;
            font-size: 17px;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .options label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: #fff;
            border-radius: 10px;
            border: 2px solid #e0e0eb;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }
        .options label:hover {
            border-color: #302b63;
            background: #f0eeff;
        }
        .options input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #302b63;
            flex-shrink: 0;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #302b63, #24243e);
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(48, 43, 99, 0.5);
        }
        .result {
            display: none;
            margin-top: 25px;
        }
        .result.active {
            display: block;
        }
        .result-score {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: #302b63;
            padding: 20px;
            background: #f0eeff;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .result-text {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a1a2e;
        }
        .result-detail {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #302b63;
        }
        .result-detail .q {
            font-weight: 600;
            color: #1a1a2e;
        }
        .result-detail .your {
            color: #e74c3c;
            font-weight: 600;
        }
        .result-detail .correct {
            color: #27ae60;
            font-weight: 600;
        }
        .result-detail .wrong {
            color: #e74c3c;
        }
        .result-detail .right {
            color: #27ae60;
        }
        .restart {
            display: block;
            width: 100%;
            padding: 14px;
            background: #e0e0eb;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .restart:hover {
            background: #cccce0;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 500px) {
            .container { padding: 20px; }
            h1 { font-size: 22px; }
            .result-score { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🧐 Насколько ты знаешь Данила?</h1>
        <p class="sub">Ответь на 10 вопросов. Будь честен 😏</p>

        <div id="quiz">
            <!-- Вопросы будут вставлены сюда через JS -->
        </div>

        <button class="btn" id="submitBtn">Узнать результат 🔥</button>

        <div class="result" id="resultBlock">
            <div class="result-score" id="scoreDisplay">0/10</div>
            <div class="result-text" id="resultMessage"></div>
            <div id="answersDetail"></div>
            <button class="restart" id="restartBtn">🔄 Пройти заново</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Сколько лет Данилу?",
                options: ["15", "16", "17", "18"],
                correct: 1 // 16
            },
            {
                q: "Какой цвет глаз у Данила?",
                options: ["Карие", "Голубые", "Зеленые", "Серые"],
                correct: 1 // Голубые
            },
            {
                q: "Что Данил любит делать в свободное время?",
                options: ["Флиртовать", "Играть в игры", "Гулять", "Спать"],
                correct: 0 // Флиртовать
            },
            {
                q: "Любимая еда Данила?",
                options: ["Пицца", "Пизда", "Бургеры", "Суши"],
                correct: 1 // Пизда
            },
            {
                q: "Знак зодиака Данила?",
                options: ["Лев", "Рыбы", "Стрелец", "Близнецы"],
                correct: 2 // Стрелец
            },
            {
                q: "Что Данил ценит в людях больше всего?",
                options: ["Честность", "Умение флиртовать", "Доброту", "Чувство юмора"],
                correct: 1 // Умение флиртовать
            },
            {
                q: "Какую музыку слушает Данил?",
                options: ["Рок", "Рэп", "Спокойную", "Электронную"],
                correct: 2 // Спокойную
            },
            {
                q: "Какое хобби у Данила?",
                options: ["Футбол", "Айти", "Рисование", "Танцы"],
                correct: 1 // Айти
            },
            {
                q: "Что Данил НЕ любит?",
                options: ["Когда опаздывают", "Айти", "Когда врут", "Когда шумят"],
                correct: 1 // Айти
            },
            {
                q: "Что для Данила было самым важным событием?",
                options: ["Первый поцелуй", "Потеря девственности (с рукой) ", "Первая зарплата", "Выпускной"],
                correct: 1 // Потеря девственности
            }
        ];

        let userAnswers = new Array(questions.length).fill(null);

        function renderQuiz() {
            const container = document.getElementById('quiz');
            container.innerHTML = '';
            questions.forEach((q, index) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.innerHTML = `
                    <div class="question-text">${index+1}. ${q.q}</div>
                    <div class="options">
                        ${q.options.map((opt, oi) => `
                            <label>
                                <input type="radio" name="q${index}" value="${oi}">
                                ${opt}
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(block);

                // Слушаем изменения
                const radios = block.querySelectorAll('input[type="radio"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', function() {
                        userAnswers[index] = parseInt(this.value);
                    });
                });
            });
        }

        function calculateResult() {
            let correct = 0;
            const details = [];

            questions.forEach((q, index) => {
                const user = userAnswers[index];
                const isCorrect = (user === q.correct);
                if (isCorrect) correct++;
                details.push({
                    question: q.q,
                    options: q.options,
                    user: user,
                    correct: q.correct,
                    isCorrect: isCorrect
                });
            });

            return { score: correct, details };
        }

        function showResult() {
            // Проверка что все вопросы отвечены
            if (userAnswers.includes(null)) {
                alert('Ответь на все вопросы, Данил ждёт! 😤');
                return;
            }

            const { score, details } = calculateResult();

            // Скрываем квиз и показываем результат
            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('resultBlock').classList.add('active');

            // Оценка
            document.getElementById('scoreDisplay').textContent = `${score}/10`;

            // Сообщение
            const msgs = [
                "😅 Ты вообще знаком с Данилом? Пересдавай!",
                "🤨 Ну такое... Мог бы и лучше знать друга.",
                "🙂 Неплохо, но есть куда расти!",
                "😏 Ого! Ты реально знаешь Данила!",
                "🔥🔥🔥 ТЫ ПРОСТО БОГ! ДАНИЛ ТВОЙ ЛУЧШИЙ ДРУГ!"
            ];
            const idx = Math.min(Math.floor(score/3), 4);
            document.getElementById('resultMessage').textContent = msgs[idx];

            // Детали по каждому вопросу
            const container = document.getElementById('answersDetail');
            container.innerHTML = '';
            details.forEach((d, i) => {
                const div = document.createElement('div');
                div.className = 'result-detail';
                const userText = d.user !== null ? d.options[d.user] : 'Не выбрано';
                const correctText = d.options[d.correct];
                div.innerHTML = `
                    <div class="q">${i+1}. ${d.question}</div>
                    <div>Твой ответ: <span class="${d.isCorrect ? 'right' : 'wrong'}">${userText}</span></div>
                    <div>Правильный: <span class="correct">${correctText}</span></div>
                `;
                container.appendChild(div);
            });
        }

        function restart() {
            userAnswers = new Array(questions.length).fill(null);
            document.getElementById('quiz').classList.remove('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
            document.getElementById('resultBlock').classList.remove('active');
            renderQuiz();
            // Сброс выбора
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Инициализация
        renderQuiz();

        document.getElementById('submitBtn').addEventListener('click', showResult);
        document.getElementById('restartBtn').addEventListener('click', restart);
    </script>
</body>
</html>
