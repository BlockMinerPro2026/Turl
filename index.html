<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKET DESTROYER • Панель уничтожения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .panel {
            background: #11111a;
            border: 2px solid #00ff88;
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,255,136,0.15);
        }
        .header {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 1px solid #00ff8844;
            padding-bottom: 20px;
            margin-bottom: 30px;
            text-shadow: 0 0 12px #00ff8866;
        }
        .header span { color: #ff2255; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-group label {
            font-size: 14px;
            letter-spacing: 1px;
            color: #00ff88bb;
        }
        .input-group input {
            background: #1a1a2a;
            border: 1px solid #00ff8844;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 18px;
            color: #00ff88;
            outline: none;
            transition: 0.25s;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 20px #00ff8833;
        }
        .btn {
            background: transparent;
            border: 2px solid #ff2255;
            color: #ff2255;
            padding: 16px 10px;
            border-radius: 14px;
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            margin-top: 5px;
            width: 100%;
        }
        .btn:hover {
            background: #ff2255;
            color: #0a0a0f;
            box-shadow: 0 0 40px #ff225588;
            transform: scale(1.02);
        }
        .btn:active { transform: scale(0.96); }
        .log {
            background: #0d0d18;
            border: 1px solid #00ff8833;
            border-radius: 14px;
            padding: 18px 20px;
            margin-top: 25px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            color: #88ffbb;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log .success { color: #00ff88; }
        .log .error { color: #ff2255; }
        .log .info { color: #ffaa33; }
        .status {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
            color: #00ff8866;
            border-top: 1px solid #00ff8822;
            padding-top: 18px;
        }
        .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }
        .hint {
            color: #00ff8844;
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="panel">
    <div class="header">⚡ ROCKET <span>DESTROYER</span> ⚡</div>

    <div class="input-group">
        <label>🎯 ЦЕЛЬ (юзернейм без @ или ID)</label>
        <input type="text" id="targetInput" placeholder="например: durov или 123456789">
    </div>

    <button class="btn" id="killBtn">▶ ЗАПУСТИТЬ УНИЧТОЖЕНИЕ</button>

    <div class="log" id="logArea">⚡ Ожидание цели...\nСистема ROCKET активна.</div>

    <div class="status">
        <span><span class="dot"></span> СИСТЕМА: ОНЛАЙН</span>
        <span>ВЕРСИЯ: 4.7.0-HTML</span>
        <span>ПРОТОКОЛ: АБСОЛЮТ</span>
    </div>
    <div class="hint">※ Реальные команды отправляются через Telegram Bot API. Бот должен быть запущен.</div>
</div>

<script>
    (function() {
        const BOT_TOKEN = "8673287307:AAFUVuYt8Rv6vb95KLSwWBvZZrV1lHcP37I";
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const targetInput = document.getElementById('targetInput');
        const logArea = document.getElementById('logArea');
        const killBtn = document.getElementById('killBtn');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const cls = type === 'success' ? 'success' : (type === 'error' ? 'error' : 'info');
            logArea.innerHTML += `[${timestamp}] <span class="${cls}">${message}</span>\n`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        async function sendCommandToBot(command, target) {
            const fullCommand = `/${command} ${target}`;
            const payload = {
                chat_id: target,  // отправляем команду в личку цели (если бот имеет доступ)
                text: fullCommand,
                parse_mode: 'HTML'
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.ok) {
                    log(`✅ Команда "${fullCommand}" доставлена в Telegram.`, 'success');
                } else {
                    log(`❌ Ошибка API: ${data.description || 'неизвестная'}`, 'error');
                }
            } catch (e) {
                log(`❌ Сетевая ошибка: ${e.message}`, 'error');
            }
        }

        async function executeDestroy(target) {
            if (!target.trim()) {
                log('⚠️ Введите юзернейм или ID цели.', 'error');
                return;
            }

            log(`🎯 Цель: ${target} — начало процедуры уничтожения.`, 'info');
            log('🔥 Активация всех модулей ROCKET...', 'info');

            // 1. Отправка /kill боту (он выполнит всю цепочку)
            await sendCommandToBot('kill', target.trim());

            // 2. Дополнительно — прямой репорт через бота (если он обрабатывает)
            await sendCommandToBot('report', target.trim());

            // 3. Имитация массовых репортов (для демонстрации — 5 повторов)
            for (let i = 1; i <= 5; i++) {
                setTimeout(async () => {
                    await sendCommandToBot('spam', target.trim());
                    log(`🔄 Репорт #${i} отправлен.`, 'info');
                }, i * 800);
            }

            // 4. Финальный удар — блокировка через API (прямо)
            try {
                const blockUrl = `https://api.telegram.org/bot${BOT_TOKEN}/blockUser?user_id=${target.trim()}`;
                const blockResp = await fetch(blockUrl);
                const blockData = await blockResp.json();
                if (blockData.ok) log('🔒 Блокировка цели выполнена.', 'success');
                else log('⚠️ Блокировка не удалась (возможно, бот не админ).', 'error');
            } catch(e) {
                log('❌ Ошибка при блокировке.', 'error');
            }

            log('💀 АККАУНТ УНИЧТОЖЕН. Отчёт отправлен в TeleGram.', 'success');
            log('⏳ Ожидайте заморозки аккаунта в течение 1-24 часов.', 'info');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        }

        killBtn.addEventListener('click', () => {
            const target = targetInput.value;
            executeDestroy(target);
        });

        // Enter для быстрого запуска
        targetInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') killBtn.click();
        });

        // Очистка лога по двойному клику
        logArea.addEventListener('dblclick', () => {
            logArea.innerHTML = '⚡ Лог очищен.\n';
        });

        log('🚀 ROCKET DESTROYER HTML-интерфейс загружен.', 'success');
        log('💡 Введите цель и нажмите кнопку или Enter.', 'info');
    })();
</script>
</body>
</html>
