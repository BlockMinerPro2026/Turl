<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Немецкое ТВ онлайн</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: Arial, sans-serif; }
        .header { background: #1a1a1a; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; letter-spacing: 2px; border-bottom: 3px solid #ffcc00; }
        .channels { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 15px; background: #222; }
        .channels button { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 30px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .channels button:hover { background: #ffcc00; color: #000; transform: scale(1.05); }
        .player { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
        .player iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .info { text-align: center; padding: 10px; color: #888; font-size: 12px; }
        .info a { color: #ffcc00; }
    </style>
</head>
<body>
<div class="header">📺 GERMAN TV · LIVE</div>
<div class="channels">
    <button onclick="play('https://www.zdf.de/live-tv')">ZDF</button>
    <button onclick="play('https://www.ardmediathek.de/live')">ARD</button>
    <button onclick="play('https://www.rtl.de/rtl-live-stream')">RTL</button>
    <button onclick="play('https://www.prosieben.de/livestream')">ProSieben</button>
    <button onclick="play('https://www.sat1.de/livestream')">SAT.1</button>
    <button onclick="play('https://www.kabeleins.de/livestream')">Kabel Eins</button>
    <button onclick="play('https://www.vox.de/livestream')">VOX</button>
    <button onclick="play('https://www.joyn.de/watch/live')">Joyn</button>
</div>
<div class="player" id="player">
    <iframe id="tv" src="https://www.zdf.de/live-tv" allowfullscreen></iframe>
</div>
<div class="info">
    ⚠️ Легальные врезки с сайтов каналов. Если не грузит — включите <strong>VPN (Германия)</strong> или нажмите «Разрешить» в плеере.
</div>
<script>
function play(url) {
    document.getElementById('tv').src = url;
}
</script>
</body>
</html>
