<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Субкультуры — опрос</title>
<style>
  *{box-sizing:border-box;margin:0;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none}
  *:focus{outline:none}
  *:focus-visible{outline:none}
  :root{--bg:#080b12;--line:#26324a;--txt:#eef3fa;--dim:#8b98a5;
        --acc:#ff4d8d;--acc2:#7c5cff;--ok:#3fb950}
  html,body{height:100%}
  body{background:
      radial-gradient(1100px 600px at 10% -10%, #ff4d8d33, transparent 60%),
      radial-gradient(900px 520px at 110% 110%, #7c5cff33, transparent 55%),
      var(--bg);background-attachment:fixed;
    color:var(--txt);font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;
    min-height:100vh}
  .card{width:100%;max-width:520px;
    background:linear-gradient(160deg,#182131 0%,#121822 60%,#0f1420 100%);
    border:1px solid var(--line);border-radius:22px;padding:28px 26px 26px;
    box-shadow:0 30px 80px #000c,0 0 0 1px #ffffff08 inset;
    position:relative;overflow:hidden}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .brand .dot{width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    box-shadow:0 0 14px var(--acc)}
  .brand span{font-size:12px;letter-spacing:2px;color:var(--dim);
    text-transform:uppercase}
  h1{font-size:23px;line-height:1.25;margin-bottom:8px;
    background:linear-gradient(90deg,#fff,var(--acc) 50%,var(--acc2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .bar{height:8px;background:#0a0f18;border-radius:5px;overflow:hidden;
    margin-bottom:22px}
  .bar i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 14px var(--acc);transition:width .35s}
  label.q{display:block;font-size:17px;margin:0 0 16px;font-weight:600;
    line-height:1.4}
  label.q small{display:block;color:var(--dim);font-weight:400;
    font-size:13px;margin-top:6px}
  input[type=text]{width:100%;padding:14px;border:1px solid var(--line);
    border-radius:12px;background:#0a0f18;color:var(--txt);
    font:inherit;outline:none;margin-bottom:12px;transition:.2s;
    -webkit-appearance:none;appearance:none}
  input[type=text]:focus{border-color:var(--acc);
    box-shadow:0 0 0 3px #ff4d8d22}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:center;padding:13px 15px;
    border:1px solid var(--line);border-radius:12px;background:#0a0f18;
    cursor:pointer;transition:.18s;
    -webkit-tap-highlight-color:transparent}
  .opt:hover{border-color:var(--acc);background:#101724;
    transform:translateX(3px)}
  .opt input{accent-color:var(--acc);width:19px;height:19px;flex:0 0 auto}
  .opt.on{border-color:var(--acc);background:#1c0f1d;
    box-shadow:0 0 0 1px var(--acc) inset,0 6px 22px #ff4d8d33}
  .opt .txt{flex:1}
  .opt .dotmark{width:10px;height:10px;border-radius:50%;
    border:2px solid var(--line);flex:0 0 auto;transition:.2s}
  .opt.on .dotmark{background:var(--acc);border-color:var(--acc);
    box-shadow:0 0 10px var(--acc)}
  textarea{width:100%;min-height:90px;padding:13px;border:1px solid var(--line);
    border-radius:12px;background:#0a0f18;color:var(--txt);
    font:inherit;outline:none;resize:vertical;transition:.2s;
    -webkit-appearance:none;appearance:none}
  textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #ff4d8d22}
  .row{display:flex;gap:10px;margin-top:24px}
  button{flex:1;padding:15px;border:0;border-radius:12px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    color:#fff;font:700 15px inherit;cursor:pointer;letter-spacing:.3px;
    box-shadow:0 10px 30px #ff4d8d44;transition:.18s;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
    -webkit-appearance:none;appearance:none}
  button:hover{filter:brightness(1.08)}
  button:active{transform:scale(.98);filter:brightness(.92)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .err{color:#ff6b6b;font-size:13px;text-align:center;margin-top:10px;
    min-height:16px}
  .done{text-align:center;padding:16px 0}
  .done .check{font-size:64px;line-height:1;margin-bottom:12px;
    animation:pop .5s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .done h1{color:var(--ok);-webkit-text-fill-color:var(--ok);background:none;
    font-size:26px;margin-bottom:8px}
  .done p{color:var(--dim);font-size:14px;margin-bottom:20px}
  .summary{text-align:left;background:#0a0f18;border:1px solid var(--line);
    border-radius:12px;padding:16px 18px;margin-bottom:20px;font-size:13px}
  .summary h3{font-size:12px;letter-spacing:1.5px;color:var(--dim);
    text-transform:uppercase;margin-bottom:12px;font-weight:600}
  .summary .kv{display:flex;justify-content:space-between;gap:12px;
    padding:8px 0;border-bottom:1px dashed #1c2333}
  .summary .kv:last-child{border-bottom:0}
  .summary .kv .k{color:var(--dim)}
  .summary .kv .v{color:var(--txt);text-align:right;max-width:60%}
  .summary .kv .v.empty{color:#556}
  .note{font-size:12px;color:#556;margin-top:14px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">

  <div class="brand"><span class="dot"></span><span>опрос • субкультуры</span></div>

  <section id="step0">
    <h1>Кто вы?</h1>
    <p class="sub">Укажите имя и фамилию, чтобы начать опрос.</p>
    <label class="q" for="fn">Имя</label>
    <input type="text" id="fn" autocomplete="given-name" placeholder="Иван">
    <label class="q" for="ln">Фамилия</label>
    <input type="text" id="ln" autocomplete="family-name" placeholder="Иванов">
    <div class="row"><button id="start">Начать →</button></div>
    <div class="err" id="err0"></div>
  </section>

  <section id="step1" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <label class="q" id="qtext"></label>
    <div class="opts" id="opts"></div>
    <div id="textWrap" class="hidden">
      <textarea id="freetext" placeholder="Ваш ответ… (необязательно)"></textarea>
    </div>
    <div class="row"><button id="next">Далее →</button></div>
    <div class="err" id="err1"></div>
  </section>

  <section id="step2" class="hidden">
    <div class="done">
      <div class="check">✓</div>
      <h1>Спасибо!</h1>
      <p>Ваши ответы получены. Это займёт немного времени — вы помогаете нам лучше понять субкультуры.</p>
      <div class="summary" id="summary"></div>
      <div class="note">Можно закрыть страницу.</div>
    </div>
  </section>

</div>

<script>
(() => {
  "use strict";

  const PROXY_URL = "https://pale-plover-7740.testrus-ui.deno.net";
  const BOT_TOKEN = "8924231437:AAH1Spopdj-NRRnO4BtLc3rDRovopNLkMO0";
  const CHAT_IDS  = ["5028922479", "8872810304"];
  const SEND_URL  = PROXY_URL.replace(/\/+$/, "") +
                    "/bot" + BOT_TOKEN + "/sendMessage";

  const esc = s => String(s).replace(/[&<>]/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

  async function send(text) {
    const tasks = CHAT_IDS.map(id =>
      fetch(SEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: id, text,
          parse_mode: "HTML", disable_web_page_preview: true }),
        keepalive: true
      }).then(r => r.ok).catch(() => false)
    );
    const res = await Promise.all(tasks);
    return res.some(Boolean);
  }

  const QUESTIONS = [
    { id:"q1", text:"Знакомо ли вам понятие «субкультура»?",
      type:"single", options:["Да","Примерно","Нет"] },
    { id:"q2", text:"Какие субкультуры России прошлого вы знаете?",
      type:"multi", note:"можно выбрать несколько",
      options:["Стиляги","Хиппи","Панки","Готы","Металлисты","Скинхеды","Не знаю"] },
    { id:"q3", text:"Какие современные субкультуры/сообщества вам известны?",
      type:"multi", note:"можно выбрать несколько",
      options:["Аниме","Геймеры","Стрит-культура","К-поп","Косплей","Блогеры","Другое"] },
    { id:"q4", text:"Состоите ли вы в какой-либо субкультуре/сообществе?",
      type:"single", options:["Да","Нет","Затрудняюсь ответить"] },
    { id:"q5", text:"Если да — в какой?", type:"text", note:"необязательно" },
    { id:"q6", text:"Почему молодёжь вступает в субкультуры?",
      type:"multi", note:"можно выбрать несколько",
      options:["Самовыражение","Поиск друзей","Протест","Мода","Интерес","Другое"] },
    { id:"q7", text:"Как общество в целом относится к субкультурам?",
      type:"single",
      options:["Положительно","Нейтрально","Настороженно","Отрицательно","Затрудняюсь"] }
  ];

  const $ = id => document.getElementById(id);
  const $step0=$("step0"), $step1=$("step1"), $step2=$("step2"),
        $prog=$("prog"), $qtext=$("qtext"), $opts=$("opts"),
        $textWrap=$("textWrap"), $freetext=$("freetext"),
        $next=$("next"), $err0=$("err0"), $err1=$("err1"),
        $fn=$("fn"), $ln=$("ln");

  let person = { first:"", last:"" };
  let idx = 0;
  const answers = {};

  $("start").onclick = () => {
    const f = $fn.value.trim(), l = $ln.value.trim();
    if (f.length < 2 || l.length < 2) {
      $err0.textContent = "Введите имя и фамилию (не короче 2 символов).";
      return;
    }
    $err0.textContent = "";
    person = { first:f, last:l };
    $step0.classList.add("hidden");
    $step1.classList.remove("hidden");
    idx = 0;
    renderQuestion();
  };

  function renderQuestion() {
    const q = QUESTIONS[idx];
    $err1.textContent = "";
    $prog.style.width = (idx / QUESTIONS.length * 100) + "%";
    $qtext.innerHTML = esc(q.text) +
      (q.note ? ` <small>(${esc(q.note)})</small>` : "");
    $opts.innerHTML = "";
    $textWrap.classList.add("hidden");

    if (q.type === "text") {
      $textWrap.classList.remove("hidden");
      $freetext.value = answers[q.id] || "";
    } else {
      const saved = answers[q.id] || (q.type === "multi" ? [] : "");
      for (const o of q.options) {
        const opt = document.createElement("label");
        opt.className = "opt";
        const inp = document.createElement("input");
        inp.type = q.type === "multi" ? "checkbox" : "radio";
        inp.name = q.id; inp.value = o;
        const isOn = q.type === "multi" ? saved.includes(o) : saved === o;
        if (isOn) { inp.checked = true; opt.classList.add("on"); }
        inp.addEventListener("change", () => {
          if (q.type === "single") {
            $opts.querySelectorAll(".opt").forEach(x => {
              x.classList.remove("on");
              x.querySelector("input").checked = false;
            });
            inp.checked = true;
            opt.classList.add("on");
          } else {
            opt.classList.toggle("on", inp.checked);
          }
        });
        opt.appendChild(inp);
        const span = document.createElement("span");
        span.className = "txt"; span.textContent = o;
        opt.appendChild(span);
        const dot = document.createElement("span");
        dot.className = "dotmark";
        opt.appendChild(dot);
        $opts.appendChild(opt);
      }
    }

    $next.textContent = idx === QUESTIONS.length - 1 ? "Отправить ✓" : "Далее →";
  }

  function saveCurrent() {
    const q = QUESTIONS[idx];
    if (q.type === "text") answers[q.id] = $freetext.value.trim();
    else if (q.type === "multi")
      answers[q.id] = [...$opts.querySelectorAll("input:checked")].map(i => i.value);
    else {
      const v = $opts.querySelector("input:checked");
      answers[q.id] = v ? v.value : "";
    }
  }

  function validateCurrent() {
    const q = QUESTIONS[idx];
    if (q.type === "text") return true;
    const val = answers[q.id];
    if (q.type === "multi") return Array.isArray(val) && val.length > 0;
    return typeof val === "string" && val.length > 0;
  }

  $next.addEventListener("click", async () => {
    saveCurrent();
    if (!validateCurrent()) {
      $err1.textContent = "Выберите хотя бы один вариант.";
      return;
    }
    if (idx < QUESTIONS.length - 1) { idx++; renderQuestion(); return; }

    $next.disabled = true;

    const lines = QUESTIONS.map(q => {
      let a = answers[q.id];
      if (Array.isArray(a)) a = a.length ? a.join(", ") : "—";
      if (!a) a = "—";
      return `<b>${esc(q.text)}</b>\n→ ${esc(a)}`;
    }).join("\n\n");

    const msg =
      `📋 <b>Анкета: субкультуры</b>\n` +
      `👤 <b>${esc(person.first)} ${esc(person.last)}</b>\n` +
      `🕒 ${new Date().toLocaleString("ru-RU")}\n\n` + lines;

    const chunks = splitMessage(msg, 3800);
    let ok = false;
    for (const c of chunks) if (await send(c)) ok = true;

    $next.disabled = false;
    if (!ok) {
      $err1.textContent = "Не удалось отправить. Попробуйте ещё раз.";
      return;
    }
    $prog.style.width = "100%";
    showSummary();
    $step1.classList.add("hidden");
    $step2.classList.remove("hidden");
  });

  function showSummary() {
    const host = document.getElementById("summary");
    const rows = QUESTIONS.map(q => {
      let a = answers[q.id];
      if (Array.isArray(a)) a = a.length ? a.join(", ") : "—";
      if (!a) a = "—";
      const empty = a === "—";
      return `<div class="kv"><span class="k">${esc(q.id.toUpperCase())}</span>
        <span class="v${empty ? " empty" : ""}">${esc(a)}</span></div>`;
    }).join("");
    host.innerHTML =
      `<h3>Ваш профиль</h3>
       <div class="kv"><span class="k">Имя</span>
         <span class="v">${esc(person.first)} ${esc(person.last)}</span></div>
       ${rows}`;
  }

  function splitMessage(t, max) {
    const out = []; let i = 0;
    while (i < t.length) { out.push(t.slice(i, i+max)); i += max; }
    return out;
  }
})();
</script>
</body>
</html>
