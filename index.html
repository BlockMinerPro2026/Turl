<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK – Kostenlos Deutsch</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            color: #ddd;
            font-family: Arial, sans-serif;
            padding: 12px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f5c842;
            padding: 10px 0;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: #f5c842;
            letter-spacing: 4px;
        }
        .season-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .season-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .season-btn.active {
            background: #f5c842;
            border-color: #f5c842;
            color: #000;
        }
        .season-btn:hover { background: #f5c842; color: #000; }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            margin-top: 15px;
        }
        .ep-card {
            background: #141414;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }
        .ep-card:hover { border-color: #f5c842; transform: scale(1.02); }
        .ep-card .thumb {
            background: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-size: 2rem;
            color: #f5c842;
        }
        .ep-card .info { padding: 12px; }
        .ep-card .info h3 { color: #fff; font-size: 1rem; }
        .ep-card .info .meta { color: #f5c842; font-size: 0.75rem; }
        .ep-card .info p { color: #999; font-size: 0.85rem; margin-top: 5px; }
        .player-wrap {
            margin-top: 25px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #f5c842;
            display: none;
        }
        .player-wrap.active { display: block; }
        .player-wrap video {
            width: 100%;
            max-height: 75vh;
            background: #000;
            display: block;
        }
        .close-player {
            background: #f5c842;
            color: #000;
            border: none;
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .close-player:hover { background: #ffd95e; }
        .status {
            color: #555;
            font-size: 0.75rem;
            margin-top: 8px;
            text-align: center;
        }
        .status a { color: #f5c842; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">⚡ DARK</div>
        <span style="color:#f5c842;">🇩🇪 Deutsch</span>
    </header>

    <div class="season-btns" id="seasonBtns">
        <button class="season-btn active" data-season="1">Staffel 1</button>
        <button class="season-btn" data-season="2">Staffel 2</button>
        <button class="season-btn" data-season="3">Staffel 3</button>
    </div>

    <div id="episodeGrid" class="episode-grid"></div>

    <div class="player-wrap" id="playerWrap">
        <video id="videoPlayer" controls autoplay preload="auto">
            <source id="videoSource" src="" type="video/mp4">
        </video>
        <button class="close-player" id="closePlayer">✕ Schließen</button>
    </div>

    <div class="status">✔ Alle Episoden mit deutscher Tonspur. <span id="sourceLabel">Quelle: Archive.org</span></div>
</div>

};

let currentSeason = 1;
const grid = document.getElementById('episodeGrid');
const playerWrap = document.getElementById('playerWrap');
const videoPlayer = document.getElementById('videoPlayer');
const videoSource = document.getElementById('videoSource');
const closeBtn = document.getElementById('closePlayer');
const sourceLabel = document.getElementById('sourceLabel');

function renderEpisodes(season) {
    const list = EPISODES[season];
    grid.innerHTML = '';
    list.forEach((ep, index) => {
        const card = document.createElement('div');
        card.className = 'ep-card';
        card.innerHTML = `
            <div class="thumb">▶ ${index+1}</div>
            <div class="info">
                <h3>${ep.title}</h3>
                <div class="meta">Staffel ${season} · Episode ${index+1}</div>
                <p>${ep.desc}</p>
            </div>
        `;
        card.addEventListener('click', () => playEpisode(ep, season, index+1));
        grid.appendChild(card);
    });
}

function playEpisode(ep, season, num) {
    // Сначала пробуем основную ссылку
    let url = ep.video;
    let usedBackup = false;

    // Функция попытки загрузки
    function tryPlay(src) {
        videoSource.src = src;
        videoPlayer.load();
        playerWrap.classList.add('active');
        videoPlayer.play().catch(() => {
            // Если не играет — пробуем бэкап
            if (!usedBackup && ep.backup) {
                usedBackup = true;
                sourceLabel.textContent = 'Quelle: Backup (Archive.org)';
                tryPlay(ep.backup);
            } else {
                // Если бэкап тоже не работает — вставляем прямую ссылку с другого зеркала
                const fallback = src.replace('archive.org', 'ia800500.us.archive.org');
                if (src !== fallback) {
                    sourceLabel.textContent = 'Quelle: Fallback';
                    tryPlay(fallback);
                } else {
                    alert('Keine Quelle verfügbar. Bitte manuell eine MP4-URL einfügen.');
                }
            }
        });
    }

    sourceLabel.textContent = 'Quelle: Primary (Archive.org)';
    tryPlay(url);
}

closeBtn.addEventListener('click', () => {
    playerWrap.classList.remove('active');
    videoPlayer.pause();
    videoSource.src = '';
    videoPlayer.load();
});

// Переключение сезонов
document.querySelectorAll('.season-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentSeason = parseInt(this.dataset.season);
        renderEpisodes(currentSeason);
        playerWrap.classList.remove('active');
        videoPlayer.pause();
    });
});

// Инициализация
renderEpisodes(1);

// Доп. фикс: если видео загрузилось — убираем сообщение о проблеме
videoPlayer.addEventListener('canplay', () => {
    sourceLabel.textContent = '✔ Deutsch Tonspur geladen';
});
</script>
