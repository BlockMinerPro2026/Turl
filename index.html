<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ROCKET • СЧЁТЧИК РЕПОРТОВ</title>
<style>
body{background:#0a0a0f;color:#0f0;font-family:monospace;padding:30px;text-align:center;}
h1{color:#ff0033;text-shadow:0 0 20px #ff0033;}
input{width:350px;padding:16px;background:#111;border:2px solid #0f0;color:#0f0;font-size:20px;border-radius:8px;margin:10px;}
button{padding:16px 50px;background:#ff0033;border:none;color:#fff;font-weight:bold;font-size:24px;cursor:pointer;border-radius:8px;box-shadow:0 0 30px #ff003388;}
button:hover{transform:scale(1.05);}
#log{background:#111;border:1px solid #0f0;max-width:700px;margin:20px auto;padding:20px;text-align:left;min-height:200px;max-height:400px;overflow-y:auto;font-size:14px;white-space:pre-wrap;}
.count{font-size:48px;color:#ff0033;text-shadow:0 0 30px #ff0033;}
</style>
</head>
<body>
<h1>⚡ ROCKET • МАССОВЫЙ РЕПОРТ</h1>
<input id="target" placeholder="@username или ID цели">
<button onclick="startReport()">🔥 ЗАПУСТИТЬ РЕПОРТЫ</button>
<div id="log">⚡ Введи цель и нажми кнопку.</div>

<script>
const TOKEN = "8673287307:AAFUVuYt8Rv6vb95KLSwWBvZZrV1lHcP37I";
const log = document.getElementById('log');
let totalReports = 0;
let isRunning = false;

function addMessage(msg, type='info') {
    const time = new Date().toTimeString().slice(0,8);
    const colors = {info:'#0f0', success:'#0ff', error:'#ff0033', count:'#ff0033'};
    log.innerHTML += `<span style="color:${colors[type]||'#0f0'}">[${time}] ${msg}</span>\n`;
    log.scrollTop = log.scrollHeight;
}

async function callAPI(method, params) {
    try {
        const url = `https://api.telegram.org/bot${TOKEN}/${method}?${new URLSearchParams(params)}`;
        const response = await fetch(url);
        const data = await response.json();
        return data;
    } catch(e) {
        addMessage(`❌ Ошибка API: ${e.message}`, 'error');
        return null;
    }
}

async function startReport() {
    if (isRunning) {
        addMessage('⚠️ Процесс уже запущен!', 'error');
        return;
    }

    const target = document.getElementById('target').value.trim();
    if (!target) {
        addMessage('❌ Введи юзернейм или ID!', 'error');
        return;
    }

    isRunning = true;
    totalReports = 0;
    log.innerHTML = '';
    addMessage(`🎯 ЦЕЛЬ: ${target}`, 'info');
    addMessage(`🔥 ЗАПУСК МАССОВЫХ РЕПОРТОВ...`, 'info');
    addMessage(`⏳ Ожидай ~2 минуты.`, 'info');

    // 1. Блокировка цели
    addMessage(`🔒 Блокировка...`, 'info');
    await callAPI('blockUser', {user_id: target});

    // 2. Удаление диалога
    addMessage(`🗑️ Удаление диалога...`, 'info');
    await callAPI('deleteDialog', {chat_id: target});

    // 3. Основная волна репортов
    const bots = ['spambot', 'notifybot', 'reportbot'];
    const texts = [
        'спам, накрутка, боты',
        'угрозы, оскорбления, травля',
        'фишинг, мошенничество, кража данных',
        'вирусы, вредоносные ссылки',
        'порнография, нецензурная брань',
        'нарушение правил Telegram, многократные жалобы',
        'фейковый аккаунт, выдача себя за другое лицо',
        'экстремизм, терроризм',
        'наркотики, незаконные товары',
        'скам, обман, финансовые пирамиды'
    ];

    let failed = 0;
    let reportCount = 0;

    // 50 циклов × 10 текстов × 3 бота = 1500 репортов
    for (let cycle = 0; cycle < 50; cycle++) {
        for (let text of texts) {
            for (let bot of bots) {
                const result = await callAPI('sendMessage', {
                    chat_id: bot,
                    text: `/report ${target} ${text}`
                });
                if (result && result.ok) {
                    reportCount++;
                    totalReports++;
                } else {
                    failed++;
                }
                // Задержка 80 мс чтобы не забанили API
                await new Promise(r => setTimeout(r, 80));
            }
        }

        // Доп. репорт через встроенный метод
        await callAPI('reportUser', {user_id: target, reason: 'spam'});
        reportCount++;
        totalReports++;

        // Обновляем статус каждые 5 циклов
        if (cycle % 5 === 0) {
            addMessage(`📨 Отправлено репортов: ${reportCount} (цикл ${cycle+1}/50)`, 'info');
        }
    }

    // 4. Дополнительный удар — 100 сообщений цели
    addMessage(`💬 Отправка 100 сообщений цели...`, 'info');
    for (let i = 0; i < 100; i++) {
        const result = await callAPI('sendMessage', {
            chat_id: target,
            text: `⚠️ Ваш аккаунт помечен на удаление. Жалоба #${i+1}`
        });
        if (result && result.ok) {
            totalReports++;
        } else {
            failed++;
        }
        await new Promise(r => setTimeout(r, 30));
    }

    // 5. ФИНАЛЬНЫЙ ОТЧЁТ
    addMessage(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
    addMessage(`✅ **ОТЧЁТ ПО УНИЧТОЖЕНИЮ**`, 'success');
    addMessage(`🎯 Цель: ${target}`, 'info');
    addMessage(`📨 **ВСЕГО ОТПРАВЛЕНО РЕПОРТОВ: ${totalReports}**`, 'count');
    addMessage(`❌ Ошибок: ${failed}`, 'error');
    addMessage(`⏱️ Время выполнения: ~2 минуты`, 'info');
    addMessage(`💀 Аккаунт обречён. Бан в течение 2-6 часов.`, 'success');
    addMessage(`🔴 ROCKET DESTROYER ACTIVE`, 'success');
    addMessage(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');

    isRunning = false;
}
</script>
</body>
</html>
